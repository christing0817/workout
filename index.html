<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101418" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="重訓紀錄" />
  <title>重訓快速紀錄</title>
  <style>
    :root{--bg:#0d1014;--panel:#171c22;--line:#29313a;--text:#f6f7f8;--muted:#97a2ad;--green:#b7f06b;--green2:#20351f;--blue:#8ed8ff;--danger:#ff8f8f;--safe:env(safe-area-inset-bottom)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
    button,input,select{font:inherit} button{cursor:pointer}.app{max-width:680px;margin:auto;padding:18px 16px calc(92px + var(--safe))}
    header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,transparent);padding:calc(8px + env(safe-area-inset-top)) 0 18px}
    .eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.12em}.top{display:flex;align-items:end;justify-content:space-between;gap:12px}
    h1{font-size:30px;line-height:1.1;margin:6px 0 0}.count{color:var(--muted);font-size:13px;white-space:nowrap}.search{margin-top:16px;width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:16px;padding:14px 16px;outline:none}.search:focus{border-color:var(--green)}
    .tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid var(--line);background:transparent;color:var(--muted);padding:9px 16px;border-radius:999px;white-space:nowrap}.tab.active{background:var(--green);border-color:var(--green);color:#10140c;font-weight:800}
    .list{display:grid;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px}.card-top{display:flex;justify-content:space-between;gap:12px}.name{font-size:18px;font-weight:800}.meta{color:var(--muted);font-size:13px;margin-top:4px}.edit{border:0;background:#252d35;color:var(--text);border-radius:12px;padding:8px 12px;align-self:start}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.stat{background:#11161b;border-radius:13px;padding:11px}.label{color:var(--muted);font-size:11px}.value{font-size:20px;font-weight:850;margin-top:3px}.goal{color:var(--green);font-size:13px;margin-top:11px}.note{color:var(--muted);font-size:12px;margin-top:6px}.trend{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px}.trend-date{color:var(--muted)}.trend-up{color:var(--green);font-weight:800}.trend-down{color:#ffb36b;font-weight:800}.trend-flat{color:var(--blue);font-weight:800}.history{grid-column:1/-1;background:#101419;border:1px solid var(--line);border-radius:14px;padding:12px}.history h3{font-size:13px;margin:0 0 8px}.history-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;color:var(--muted);font-size:12px;padding:7px 0;border-top:1px solid #242b33}.history-row:first-of-type{border-top:0}
    .empty{text-align:center;color:var(--muted);padding:52px 20px}.fab{position:fixed;right:max(18px,calc((100vw - 680px)/2 + 18px));bottom:calc(20px + var(--safe));border:0;background:var(--green);color:#10140c;font-weight:850;border-radius:18px;padding:15px 20px;box-shadow:0 8px 28px #0009}
    .tools{display:flex;gap:8px;margin:18px 0}.secondary{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:13px;padding:11px}
    dialog{width:min(92vw,520px);border:1px solid var(--line);border-radius:24px;background:var(--panel);color:var(--text);padding:0;box-shadow:0 24px 80px #000c}dialog::backdrop{background:#000a}.modal{padding:20px}.modal h2{margin:0 0 16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:12px}.field input,.field select{width:100%;border:1px solid var(--line);background:#101419;color:var(--text);border-radius:12px;padding:12px;outline:none}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1;border:0;border-radius:13px;padding:12px}.cancel{background:#2a3139;color:var(--text)}.save{background:var(--green);color:#10140c;font-weight:800}.delete{background:#3a2023!important;color:var(--danger)}
    .toast{position:fixed;left:50%;bottom:calc(90px + var(--safe));transform:translateX(-50%) translateY(20px);background:#eef6e8;color:#17210f;border-radius:12px;padding:10px 16px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:420px){.form{grid-template-columns:1fr}.field.full{grid-column:auto}.app{padding-left:13px;padding-right:13px}}
  </style>
</head>
<body>
<main class="app">
  <header><div class="eyebrow">WORKOUT LOG</div><div class="top"><h1>上次做多少？</h1><div class="count" id="count"></div></div><input class="search" id="search" type="search" placeholder="搜尋動作、健身房或機台" /></header>
  <div class="tools"><button class="secondary" id="movesView">依部位看動作</button><button class="secondary" id="coursesView">教練課紀錄</button><button class="secondary" id="newCourse">＋ 教練課</button></div><nav class="tabs" id="tabs"></nav>
  <section class="list" id="list"></section>
  <div class="tools"><button class="secondary" id="exportBtn">匯出備份</button><button class="secondary" id="importBtn">匯入備份</button><input id="fileInput" type="file" accept="application/json" hidden /></div>
</main>
<button class="fab" id="addBtn">＋ 新增動作</button>
<dialog id="dialog"><form class="modal" id="form" method="dialog"><h2 id="modalTitle">新增動作</h2><div class="form">
  <div class="field"><label>部位</label><select id="part" required><option>背</option><option>胸</option><option>肩</option><option>腿臀</option><option>手</option><option>伸展</option></select></div>
  <div class="field"><label>動作名稱</label><input id="name" required placeholder="例：臀推" /></div>
  <div class="field"><label>健身房</label><select id="gym"><option value="">未選擇</option><option>信義</option><option>萬隆</option></select></div><div class="field"><label>機台</label><input id="machine" placeholder="例：L3" /></div>
  <div class="field"><label>重量</label><input id="weight" inputmode="decimal" placeholder="例：25" /></div><div class="field"><label>重量單位</label><select id="unit"><option value="kg">公斤 kg</option><option value="lb">磅 lb</option></select></div>
  <div class="field"><label>次數</label><input id="reps" inputmode="numeric" placeholder="例：12" /></div><div class="field"><label>紀錄日期</label><input id="date" type="date" /></div>
  <div class="field"><label>組數</label><input id="sets" inputmode="numeric" placeholder="例：4" /></div>
<div class="field"><label>訓練類型</label><select id="trainingType"><option value="solo">自主訓練</option><option value="coach">教練課</option></select></div>
<div class="field full"><label>所屬教練課</label><select id="sessionId"><option value="">新的一堂課</option></select></div>
<div class="field full"><label>教練提醒／當次感受</label><input id="coachNote" placeholder="例：肩膀放鬆、胸口靠穩" /></div>
<div class="field full"><label>下次目標</label><input id="goal" placeholder="例：同重量做到 13 次" /></div><div class="field full"><label>備註</label><input id="note" placeholder="姿勢、感受或其他提醒" /></div>
  <div class="history" id="historyBox"><h3>近期紀錄</h3><div id="historyList"></div></div>
  </div><div class="actions"><button type="button" class="delete" id="deleteBtn">刪除</button><button type="button" class="cancel" id="cancelBtn">取消</button><button type="submit" class="save">儲存</button></div></form></dialog>
<div class="toast" id="toast">已儲存</div>
<script>
const defaults=[
['背','壓胸／待確認','','N5','5','—','重量不變，確認動作名稱',''],['背','單側划船','','划船（右）','19','—','兩側次數一致',''],['背','待確認動作','','B5','25 kg','15','做到 16 次或小幅加重',''],['背','待確認動作','','B6','9.5 kg','15','做到 16 次或小幅加重',''],['背','拉背','','N7','26 kg','12','做到 13 次',''],['背','高位下拉','','N9','9 lb','15','先穩定完成 15 次',''],['背','ISO-Lateral Row','','H25','單邊 9','—','補上次數',''],['背','引體向上輔助','','','輔助 37.5 kg','12','同次數降低輔助重量',''],['背','直臂下壓','','','7.5','15','做到 16 次或小幅加重',''],['背','坐姿划船','','R7','4.5 kg','15','確認是公斤或片數',''],['背','高位下拉','','','第 3 片＋槓','—','補上次數',''],
['胸','Wide Chest Press','','','2.5','10','做到 11 次',''],['胸','待確認動作','','C6','15','15','做到 16 次或小幅加重',''],['胸','待確認動作','','C7','5','—','補上次數',''],['胸','待確認動作','','N11','5','—','補上次數',''],['胸','待確認動作','','A11','15','—','補上次數',''],['胸','待確認動作','','C3','10','15','做到 16 次或小幅加重',''],['胸','待確認動作','','C4','5','20','小幅加重',''],['胸','下胸','','大型工作站','3.75','—','補上次數與單位',''],['胸','蝴蝶機夾胸','','','12.5','—','補上場館與次數',''],['胸','上胸擴胸','','','4.5 kg','—','補上次數',''],['胸','Cable 下胸下推','','','3.75 lb','—','補上場館與次數',''],
['肩','肩上舉','','','10','—','補上場館與次數',''],['肩','飛鳥','','','5','—','確認另一筆「飛鳥15」含義',''],['肩','待確認動作','','C1','12','—','補上動作名稱與次數',''],['肩','待確認動作','','T7','10','—','補上動作名稱與次數',''],['肩','待確認動作','','S2','5','—','補上動作名稱與次數',''],['肩','面拉','','','7.5','—','補上場館與次數',''],
['腿臀','Leg Curl','','L3','27','—','降重確認姿勢或換機台',''],['腿臀','倒蹬機','','','25','—','補上次數',''],['腿臀','待確認動作','','N1','11.3','12','做到 13 次',''],['腿臀','哈克深蹲','','','25＋45','15','同重量穩定完成',''],['腿臀','待確認動作','','L4','27＋2','—','補上次數與單位',''],['腿臀','待確認動作','','L7','19','—','補上動作名稱與次數',''],['腿臀','待確認動作','','L8','15','—','補上動作名稱與次數',''],['手','三頭肌','','A5','—','—','完成一組基準紀錄','']
].map((x,i)=>normalize({id:'seed-'+i,part:x[0],name:x[1],gym:x[2],machine:x[3],weight:x[4],reps:x[5],goal:x[6],note:x[7]}));
const parts=['背','胸','肩','腿臀','手','伸展']; let active='背',editing=null,view='moves',pendingSession='';
function today(){return new Date().toLocaleDateString('sv-SE')}
function normalize(x){
  const raw=String(x.weight??'');
  const unit=x.unit||(raw.match(/lb|磅/i)?'lb':'kg');
  const weight=raw.replace(/\s*(kg|公斤|lb|磅)\s*/gi,' ').trim();
  return {...x,id:x.id||('item-'+Math.random().toString(36).slice(2)),part:x.part||'背',name:x.name||'未命名動作',gym:['信義','萬隆'].includes(x.gym)?x.gym:'',machine:x.machine||'',weight:weight==='—'?'':weight,unit,reps:x.reps==='—'?'':String(x.reps??''),date:x.date||'',goal:x.goal||'',note:x.note||'',sets:String(x.sets||''),trainingType:x.trainingType==='coach'?'coach':'solo',sessionId:x.sessionId||'',coachNote:x.coachNote||'',history:Array.isArray(x.history)?x.history:[]};
}
let data=(()=>{try{return (JSON.parse(localStorage.getItem('workout-data'))||defaults).map(normalize)}catch{return defaults}})();
const $=s=>document.querySelector(s), list=$('#list'), tabs=$('#tabs'), dialog=$('#dialog');
function persist(){localStorage.setItem('workout-data',JSON.stringify(data))} function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function numeric(v){return /^\d+(?:\.\d+)?$/.test(String(v).trim())?Number(v):null}
function snapshot(x,date=x.date||''){return {date,weight:x.weight||'',unit:x.unit||'kg',reps:x.reps||'',sets:x.sets||'',trainingType:x.trainingType||'solo',sessionId:x.sessionId||'',coachNote:x.coachNote||'',note:x.note||''}}
function trendInfo(x){const h=(x.history||[]).filter(v=>numeric(v.weight)!==null);if(h.length<2)return {text:'尚無趨勢',cls:'trend-flat'};const a=h[h.length-2],b=h[h.length-1];if(a.unit!==b.unit)return {text:'單位不同，暫不比較',cls:'trend-flat'};const d=numeric(b.weight)-numeric(a.weight);return d>0?{text:`重量 +${d} ${b.unit}`,cls:'trend-up'}:d<0?{text:`重量 ${d} ${b.unit}`,cls:'trend-down'}:{text:'重量持平',cls:'trend-flat'}}
function renderTabs(){tabs.innerHTML=parts.map(p=>`<button class="tab ${p===active?'active':''}" data-part="${p}">${p}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.part;render()})}
function render(){if(view==='courses'){renderCourses();return}tabs.style.display='flex';renderTabs();const q=$('#search').value.trim().toLowerCase();const shown=data.filter(x=>x.part===active&&[x.name,x.gym,x.machine].join(' ').toLowerCase().includes(q));$('#count').textContent=`${shown.length} 個動作`;list.innerHTML=shown.length?shown.map(x=>{const t=trendInfo(x),weight=x.weight?`${x.weight} ${x.unit}`:'—';return `<article class="card"><div class="card-top"><div><div class="name">${esc(x.name)}</div><div class="meta">${esc([x.gym,x.machine].filter(Boolean).join(' · ')||'尚未填寫場館／機台')}</div></div><button class="edit" data-id="${x.id}">編輯</button></div><div class="stats"><div class="stat"><div class="label">最新重量</div><div class="value">${esc(weight)}</div></div><div class="stat"><div class="label">最新次數</div><div class="value">${esc((x.reps||'—')+(x.sets?' 次 × '+x.sets+' 組':''))}</div></div></div><div class="trend"><span class="${t.cls}">${esc(t.text)}</span><span class="trend-date">${esc(x.date||'尚未記錄日期')}</span></div>${x.trainingType==='coach'?'<div class="goal">教練課</div>':''}${x.coachNote?`<div class="note">教練提醒：${esc(x.coachNote)}</div>`:''}${x.goal?`<div class="goal">下次：${esc(x.goal)}</div>`:''}${x.note?`<div class="note">${esc(x.note)}</div>`:''}</article>`}).join(''):'<div class="empty">找不到動作<br>可以按右下角新增</div>';list.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openForm(b.dataset.id))}
function renderHistory(x){const h=(x.history||[]).slice(-5).reverse();$('#historyBox').style.display=editing?'block':'none';$('#historyList').innerHTML=h.length?h.map(v=>`<div class="history-row"><span>${esc(v.date||'先前紀錄')}</span><span>${esc(v.weight?`${v.weight} ${v.unit}`:'—')}</span><span>${esc(v.reps?`${v.reps} 次${v.sets?' × '+v.sets+' 組':''}${v.trainingType==='coach'?' · 教練課':''}`:'—')}</span></div>`).join(''):'<div class="meta">儲存本次紀錄後，這裡會顯示歷史趨勢。</div>'}
function openForm(id=null){editing=id;const x=id?data.find(v=>v.id===id):normalize({part:active,name:'',gym:'',machine:'',weight:'',unit:'kg',reps:'',date:today(),goal:'',note:''});$('#modalTitle').textContent=id?'更新訓練紀錄':'新增動作';['part','name','gym','machine','weight','unit','reps','goal','note','sets','trainingType','coachNote'].forEach(k=>$('#'+k).value=x[k]||'');if(!id){$('#trainingType').value=view==='courses'?'coach':'solo'}
const sessions=courseGroups();$('#sessionId').innerHTML='<option value="">新的一堂課</option>'+sessions.map(c=>`<option value="${esc(c.id)}">${esc(c.date||'日期待補')} · ${esc(c.title)}</option>`).join('');
$('#sessionId').value=x.sessionId||pendingSession;$('#sessionId').onchange=()=>{const c=courseGroups().find(c=>c.id===$('#sessionId').value);if(c)$('#date').value=c.date};
$('#date').value=id?x.date:((courseGroups().find(c=>c.id===pendingSession)||{}).date??today());$('#deleteBtn').style.display=id?'block':'none';renderHistory(x);dialog.showModal()}
$('#form').onsubmit=e=>{e.preventDefault();const obj={};['part','name','gym','machine','weight','unit','reps','date','goal','note','sets','trainingType','sessionId','coachNote'].forEach(k=>obj[k]=$('#'+k).value.trim());if(obj.trainingType==='coach'){if(!obj.sessionId)obj.sessionId='course-'+crypto.randomUUID();pendingSession=obj.sessionId;const c=courseGroups().find(c=>c.id===obj.sessionId);if(c)obj.date=c.date}else{obj.sessionId=''}if(editing){const i=data.findIndex(x=>x.id===editing),prev=data[i];let history=[...(prev.history||[])];if(!history.length&&(prev.weight||prev.reps))history.push(snapshot(prev,prev.date));const next=snapshot(obj,obj.date);const last=history[history.length-1];if(!last||JSON.stringify(last)!==JSON.stringify(next))history.push(next);data[i]=normalize({...prev,...obj,history})}else{const history=(obj.weight||obj.reps)?[snapshot(obj,obj.date)]:[];data.push(normalize({id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(),...obj,history}))}active=obj.part;persist();dialog.close();render();toast()};
$('#deleteBtn').onclick=()=>{if(confirm('確定刪除這個動作？')){data=data.filter(x=>x.id!==editing);persist();dialog.close();render();toast('已刪除')}};$('#cancelBtn').onclick=()=>dialog.close();$('#addBtn').onclick=()=>openForm();$('#search').oninput=render;
function toast(msg='已儲存'){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}
$('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`workout-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};
$('#importBtn').onclick=()=>$('#fileInput').click();
function mergeBackup(current,incoming){const byId=new Map(current.map(x=>[x.id,x]));for(const raw of incoming){if(!raw||typeof raw!=='object'||typeof raw.name!=='string'||!raw.id)throw Error('invalid');const x=normalize(raw),old=byId.get(x.id);if(!old){byId.set(x.id,x);continue}const history=[...(old.history||[])];for(const h of x.history||[]){if(!history.some(v=>JSON.stringify(v)===JSON.stringify(h)))history.push(h)}history.sort((a,b)=>(a.date||'').localeCompare(b.date||''));byId.set(x.id,{...old,history})}return [...byId.values()]}
$('#fileInput').onchange=async e=>{try{const incoming=JSON.parse(await e.target.files[0].text());if(!Array.isArray(incoming))throw Error('invalid');const merged=mergeBackup(data,incoming);localStorage.setItem('workout-pre-import-backup',JSON.stringify(data));data=merged;persist();view='courses';render();toast('已合併匯入，原有紀錄已保留')}catch{alert('這個備份檔案格式不正確，原有紀錄未變更')}e.target.value=''};
function courseGroups(){const groups=new Map();data.filter(x=>x.trainingType==='coach').forEach(x=>{const id=x.sessionId||('legacy-'+x.id);if(!groups.has(id))groups.set(id,{id,date:x.date||'',title:'教練課',items:[]});groups.get(id).items.push(x)});return [...groups.values()].sort((a,b)=>b.date.localeCompare(a.date))}
function renderCourses(){tabs.style.display='none';const q=$('#search').value.trim().toLowerCase();const groups=courseGroups().filter(c=>[c.date,...c.items.flatMap(x=>[x.name,x.gym,x.machine,x.coachNote])].join(' ').toLowerCase().includes(q));$('#count').textContent=groups.length+' 堂課';list.innerHTML=groups.length?groups.map(c=>`<article class="card"><div class="card-top"><div><div class="name">${esc(c.date||'日期待補')} · 教練課</div><div class="meta">${c.items.length} 個動作 · ${esc([...new Set(c.items.map(x=>x.gym).filter(Boolean))].join('、')||'場館待補')}</div></div><button class="edit" data-date-session="${esc(c.id)}">改日期</button></div>${c.items.map(x=>`<div class="trend"><div><div>${esc(x.name)}</div><div class="meta">${esc(x.weight?(x.weight==='空槓'?'空槓（槓重待確認）':x.weight+' '+x.unit):'徒手／未填重量')} · ${esc(x.reps?x.reps+' 次'+(x.sets?' × '+x.sets+' 組':''):'次數／時間未記錄')}</div>${x.machine?`<div class="note">${esc(x.machine)}</div>`:''}${x.note?`<div class="note">${esc(x.note)}</div>`:''}${x.coachNote?`<div class="goal">教練提醒：${esc(x.coachNote)}</div>`:''}</div><button class="edit" data-id="${esc(x.id)}">編輯</button></div>`).join('')}<button class="secondary" data-add-session="${esc(c.id)}" style="width:100%;margin-top:12px">＋ 加入動作</button></article>`).join(''):'<div class="empty">還沒有教練課紀錄<br>按「＋ 教練課」開始記錄</div>';list.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openForm(b.dataset.id));list.querySelectorAll('[data-add-session]').forEach(b=>b.onclick=()=>{pendingSession=b.dataset.addSession;openForm()});list.querySelectorAll('[data-date-session]').forEach(b=>b.onclick=()=>openCourseDate(b.dataset.dateSession))}
function openCourseDate(id){const c=courseGroups().find(c=>c.id===id);const d=document.createElement('dialog');d.innerHTML='<form class="modal"><h2>教練課日期</h2><div class="field"><label>整堂課的日期</label><input type="date" id="courseDate" required></div><div class="actions"><button type="button" class="cancel">取消</button><button class="save">儲存</button></div></form>';document.body.append(d);d.querySelector('input').value=c.date;d.querySelector('.cancel').onclick=()=>{d.close();d.remove()};d.querySelector('form').onsubmit=e=>{e.preventDefault();const date=d.querySelector('input').value;data=data.map(x=>x.sessionId===id?{...x,date,history:x.history.map(h=>h.sessionId===id?{...h,date}:h)}:x);persist();d.close();d.remove();render();toast()};d.showModal()}
$('#movesView').onclick=()=>{view='moves';pendingSession='';render()};$('#coursesView').onclick=()=>{view='courses';pendingSession='';render()};$('#newCourse').onclick=()=>{view='courses';pendingSession='';openForm()};
persist();render();
</script>
</body></html>
