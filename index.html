function normalize(x){return {...x,id:x.id||crypto.randomUUID(),part:x.part||'背',name:x.name||'未命名動作',gym:x.gym||(x.trainingType==='coach'?'信義':''),machine:x.machine||'',weight:String(x.weight??'').replace(/\s*(kg|公斤|lb|磅)\s*/gi,' ').replace('—','').trim(),unit:x.unit||(/lb|磅/i.test(String(x.weight))?'lb':'kg'),reps:String(x.reps??'').replace('—',''),sets:String(x.sets||''),date:x.date||'',goal:x.goal||'',note:x.note||'',coachNote:x.coachNote||'',courseReminder:x.courseReminder||'',trainingType:x.trainingType==='coach'?'coach':'solo',sessionId:x.sessionId||'',weightMode:x.weightMode||'',barWeight:String(x.barWeight||''),segments:Array.isArray(x.segments)?x.segments.map(v=>({...v})):[],history:Array.isArray(x.history)?x.history:[]}}
const $=s=>document.querySelector(s),modal=$('#modal'),parts=['全部','背','胸','肩','腿臀','手','伸展'];let prefs={};try{prefs=JSON.parse(localStorage.getItem('workout-view-prefs'))||{}}catch{}let view='moves',part=parts.includes(prefs.part)?prefs.part:'全部',gym=prefs.gym||'信義';

function commit(next,msg='已儲存'){const previous=JSON.parse(JSON.stringify(data));try{localStorage.setItem('workout-data',JSON.stringify(next))}catch{toast('儲存未成功，請先匯出備份再重試');return false}undoState=previous;data=next;render();toast(msg,true);return true}
function undoLast(){if(!undoState)return;const previous=undoState;try{localStorage.setItem('workout-data',JSON.stringify(previous))}catch{toast('撤回未成功');return}data=previous;undoState=null;render();toast('已撤回上一筆操作')}

function visibleGroups(){return movementGroups().map(g=>{const items=locationItems(g);return {...g,sourceItems:g.items,items,latest:items[0]}}).filter(g=>g.latest)}
// An exercise groups across training types and locations; equipment variants stay distinct.
function exerciseKey(x){if(x.exerciseKey)return x.exerciseKey;let name=x.name.trim(),machine=x.machine.trim();if(machine==='啞鈴'&&['肩上推（前束）','啞鈴肩推'].includes(name))name='啞鈴肩推';if(/T[- ]?bar/i.test(name))return 'T-bar 划船|T-bar';return name+'|'+machine}

function courses(){const m=new Map();for(const x of data.filter(x=>x.trainingType==='coach')){const id=x.sessionId||'legacy-'+x.id;if(!m.has(id))m.set(id,{id,date:x.date,title:x.courseTitle||'教練課',reminder:x.courseReminder||'',items:[]});m.get(id).items.push(x);if(x.courseReminder)m.get(id).reminder=x.courseReminder}return [...m.values()].sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function segmentsOf(x){return x.segments?.length?x.segments.map(v=>({...v})): [{weight:x.weight||'',unit:x.unit||'kg',reps:x.reps||'',sets:x.sets||''}]}
const modeLabels={'':'重量基準待確認',unknown:'重量基準待確認',single:'單支重量',total:'含槓總重量',plates:'加掛槓片重量',machine:'機台顯示重量',assist:'輔助重量',bodyweight:'徒手／自體重量'};
function basis(x){return (modeLabels[x.weightMode]||modeLabels[''])+(x.weightMode==='plates'?(x.barWeight?' · 空槓 '+x.barWeight+' kg':' · 空槓重量待確認'):'')}

function render(){const scroll=window.scrollY;const q=$('#search').value.trim().toLowerCase();$('#movesView').classList.toggle('active',view==='moves');$('#coursesView').classList.toggle('active',view==='courses');$('#gymSection').hidden=view!=='moves';$('#filters').hidden=view!=='moves';const gyms=['信義','萬隆',...new Set(data.map(x=>x.gym).filter(x=>x&&!['信義','萬隆'].includes(x)))];if(data.some(x=>!x.gym))gyms.push('未分類');gyms.push('全部');$('#gymFilters').innerHTML=gyms.map(p=>`<button class="chip ${gym===p?'active':''}" data-gym="${esc(p)}">${esc(p)}</button>`).join('');$('#gymFilters').querySelectorAll('button').forEach(b=>b.onclick=()=>{gym=b.dataset.gym;rememberFilters();render()});$('#filters').innerHTML=parts.map(p=>`<button class="chip ${part===p?'active':''}" data-part="${p}">${p}</button>`).join('');$('#filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{part=b.dataset.part;rememberFilters();render()});$('#addBtn').textContent=view==='moves'?'＋ 新增動作':'＋ 記一堂課';$('#intro').innerHTML=view==='courses'?'<div class="hint">教練課預設在信義。上課成績和動作提醒會回到信義的動作表；整堂課的重點放在這裡。</div>':'';
if(view==='moves'){const groups=visibleGroups().filter(g=>(part==='全部'||g.latest.part===part)&&[g.name,...g.items.flatMap(x=>[x.machine,x.gym,x.coachNote])].join(' ').toLowerCase().includes(q));const done=groups.filter(g=>g.items.some(x=>x.date===today())).length;$('#count').textContent=groups.length+' 個動作'+(done?' · 今天已記 '+done+' 個':'');$('#list').innerHTML=groups.map(g=>{const x=g.latest,rem=coachReminder(g),key=esc(g.key),recorded=g.items.some(x=>x.date===today());return `<article class="card"><div class="row"><h3>${esc(g.name)}</h3><span class="muted">${esc(x.part)}</span></div><div class="machine">${esc(x.gym||'場館未分類')} · ${esc(x.machine||'器材待補')}</div><div class="muted" style="margin-top:13px">上次成績</div>${summaryHTML(x)}<div class="row"><span class="muted">${esc(dateText(x))}</span>${x.trainingType==='coach'?'<span class="badge">教練課</span>':''}</div>${recorded?'<div class="today-badge">今天已記錄</div>':''}${rem?`<div class="reminder"><div class="reminder-label">教練提醒 · 練前看一下</div><div class="reminder-preview">${esc(rem)}</div></div>`:''}${x.goal?`<div class="muted">下次目標：${esc(x.goal)}</div>`:''}<div class="actions"><button class="primary small" data-record="${key}">記錄這次</button><button class="secondary small" data-quick="${key}">照上次完成</button></div><button class="secondary small" data-detail="${key}" style="width:100%;margin-top:8px">歷史與完整提醒</button></article>`}).join('')||'<div class="empty">這個場館還沒有符合的動作<br>可以新增動作，或切換「全部」查看。<br>沒有填場館的舊紀錄會放在「未分類」。</div>';$('#list').querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>openRecord(b.dataset.record));$('#list').querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>quickRecord(b.dataset.quick));$('#list').querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetails(b.dataset.detail));
}else{const cs=courses().filter(c=>[c.date,c.title,c.reminder,...c.items.map(x=>x.name)].join(' ').toLowerCase().includes(q));$('#count').textContent=cs.length+' 堂教練課';$('#list').innerHTML=cs.map(c=>`<article class="card"><div class="row"><h3>${esc(c.title)}</h3><button class="secondary small" data-course="${esc(c.id)}">編輯課程</button></div><div class="muted">${esc(c.date||'日期待補')} · ${c.items.length} 個動作</div><div class="course-place">${esc([...new Set(c.items.map(x=>x.gym))].join('、'))}</div><div class="reminder"><div class="reminder-label">這堂課的重點提醒</div>${esc(c.reminder||'還沒記提醒，點「編輯課程」補上。')}</div>${c.items.map(x=>`<div class="course-item"><div class="row"><h3>${esc(x.name)}</h3><button class="secondary small" data-detail="${esc(exerciseKey(x))}">看動作</button></div><div class="machine">${esc(x.machine||'器材待補')}</div>${summaryHTML(x)}${x.coachNote?`<div class="muted">教練提醒：${esc(x.coachNote)}</div>`:''}${x.note?`<div class="muted">${esc(x.note)}</div>`:''}</div>`).join('')}</article>`).join('')||'<div class="empty">記下第一堂課吧<br>上課動作、重量和重點提醒會放在一起。</div>';$('#list').querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>openCourse(b.dataset.course));$('#list').querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetails(b.dataset.detail))}window.scrollTo(0,scroll)}
function showModal(title,content){modal.innerHTML=`<div class="dialog-head"><h2>${esc(title)}</h2><button type="button" class="close" aria-label="關閉">×</button></div>${content}`;modal.querySelectorAll('input,select,textarea').forEach(el=>{if(!el.getAttribute('aria-label')&&!el.id){const label=el.closest('.field')?.querySelector('label');if(label)el.setAttribute('aria-label',label.textContent)}});modal.querySelector('.close').onclick=()=>modal.close();if(!modal.open)modal.showModal()}
function field(label,id,value='',type='text',full=false){return `<div class="field ${full?'full':''}"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`}
function partSelect(value,id='fPart'){return `<div class="field"><label for="${id}">部位</label><select id="${id}">${parts.slice(1).map(p=>`<option ${p===value?'selected':''}>${p}</option>`).join('')}</select></div>`}
function snapshot(x){return {...Object.fromEntries(['date','weight','unit','reps','sets','trainingType','sessionId','coachNote','note','gym','machine','weightMode','barWeight'].map(k=>[k,x[k]||''])),segments:segmentsOf(x)}}
function modeField(x,id='fMode'){return `<div class="field"><label for="${id}">重量怎麼算？</label><select id="${id}">${Object.entries(modeLabels).filter(([k])=>k!=='unknown').map(([k,v])=>`<option value="${k}" ${k===x.weightMode?'selected':''}>${v}</option>`).join('')}</select></div>`}
function segmentFields(v,i){return `<div class="segment-row" data-segment="${i}"><div><label>重量</label><input data-seg="weight" aria-label="第 ${i+1} 段重量" value="${esc(v.weight)}" placeholder="數字／空槓"></div><div><label>單位</label><select data-seg="unit" aria-label="第 ${i+1} 段單位"><option value="kg" ${v.unit==='kg'?'selected':''}>kg</option><option value="lb" ${v.unit==='lb'?'selected':''}>lb</option></select></div><div><label>每組次數</label><input data-seg="reps" aria-label="第 ${i+1} 段次數" value="${esc(v.reps)}" inputmode="numeric"></div><div><label>組數</label><input data-seg="sets" aria-label="第 ${i+1} 段組數" value="${esc(v.sets)}" type="number" min="1" step="1"></div><button type="button" class="secondary remove-segment" data-remove-seg="${i}" aria-label="移除第 ${i+1} 段">×</button></div>`}
function readSegments(container){return [...container.querySelectorAll('[data-segment]')].map(row=>Object.fromEntries(['weight','unit','reps','sets'].map(k=>[k,row.querySelector(`[data-seg="${k}"]`).value.trim()])))}
function applySegments(x,segments){const last=segments.at(-1)||{};return {...x,segments:segments.map(v=>({...v})),weight:last.weight||'',unit:last.unit||'kg',reps:last.reps||'',sets:last.sets||''}}
function bindSegments(container,segments,onChange){container.innerHTML=segments.map(segmentFields).join('');container.querySelectorAll('[data-remove-seg]').forEach(b=>b.onclick=()=>{const next=readSegments(container);if(next.length===1){toast('至少保留一段紀錄');return}next.splice(Number(b.dataset.removeSeg),1);onChange(next)})}
function todayRecords(key,date,location){return sorted(data.filter(x=>exerciseKey(x)===key&&x.date===date&&x.gym===location))}
function duplicateGuard(obj,onAdd,ignoreId=null){const existing=todayRecords(exerciseKey(obj),obj.date,obj.gym).filter(x=>x.id!==ignoreId);if(!existing.length){onAdd();return}const d=$('#duplicateModal');d.innerHTML=`<h2>這天已經記過了</h2><p class="muted">${esc(obj.gym||'未分類')} · ${esc(obj.name)} · ${esc(obj.date)}<br>已有 ${existing.length} 筆紀錄，最新一筆來自${existing[0].trainingType==='coach'?'教練課':'自主訓練'}。</p><div class="duplicate-choice"><button class="primary" id="dupNew">另存一筆（又練了一次）</button><button class="secondary" id="dupEdit">修改已有紀錄</button><button class="secondary" id="dupCancel">返回</button></div>`;$('#dupNew').onclick=()=>{d.close();onAdd()};$('#dupEdit').onclick=()=>{d.close();openRecord(exerciseKey(existing[0]),existing[0].id)};$('#dupCancel').onclick=()=>d.close();d.showModal()}
function savedRecord(template,overrides={}){const obj=normalize({...template,...overrides,id:crypto.randomUUID(),date:overrides.date??today(),trainingType:'solo',sessionId:'',courseTitle:'',courseReminder:'',history:[]});obj.history=[snapshot(obj)];return obj}
function quickRecord(key){const g=visibleGroups().find(g=>g.key===key);if(!g)return;const x=g.latest;const complete=segmentsOf(x).every(v=>v.reps&&v.sets&&(v.weight||x.weightMode==='bodyweight'));if(!complete||!x.weightMode||x.weightMode==='unknown'||gym==='全部'||gym==='未分類'){openRecord(key);toast('先補齊場館、重量基準與組數，再儲存');return}const obj=savedRecord(x,{note:'',coachNote:coachReminder(g)});duplicateGuard(obj,()=>commit([...data,obj],'已照上次成績記錄今天的訓練'))}
function openRecord(key=null,editId=null){const full=movementGroups().find(g=>g.key===key),local=visibleGroups().find(g=>g.key===key),g=local||full,old=editId?data.find(x=>x.id===editId):null,x=old||g?.latest||normalize({name:'',part:part==='全部'?'背':part,gym:['全部','未分類'].includes(gym)?'':gym});let segments=segmentsOf(x);showModal(editId?'修改這筆紀錄':key?'記錄這次訓練':'新增動作',`<form id="recordForm"><div class="form-grid">${field('動作名稱','fName',key||editId?x.name:'','text',true)}${partSelect(x.part)}${field('器材／機台','fMachine',x.machine)}${field('健身房','fGym',x.gym)}${field('日期','fDate',editId?x.date:today(),'date')}${modeField(x)}${field('空槓重量 kg（選填）','fBar',x.barWeight)}</div><div class="segment-heading">完成整個動作後，一次記下重量、次數與組數</div><div id="recordSegments"></div><button type="button" class="secondary small" id="addSegment" style="margin:12px 0">＋ 加一段重量（加重／降重）</button><div class="form-grid">${field('下次目標','fGoal',x.goal,'text',true)}<div class="field full"><label for="fCoach">教練提醒（自主練習也看得到）</label><textarea id="fCoach">${esc(old?.coachNote||coachReminder(g||{items:[]})||'')}</textarea></div>${field('當次感受／備註','fNote',editId?x.note:'','text',true)}</div><div class="actions">${old?'<button type="button" class="secondary danger" id="deleteRecord">刪除這筆</button>':''}<button class="primary">儲存紀錄</button></div></form>`);$('#fName').required=true;$('#fGym').required=true;$('#fDate').required=true;const draw=()=>bindSegments($('#recordSegments'),segments,next=>{segments=next;draw()});draw();$('#addSegment').onclick=()=>{segments=readSegments($('#recordSegments'));segments.push({weight:'',unit:segments.at(-1)?.unit||'kg',reps:'',sets:''});draw()};$('#recordForm').onsubmit=e=>{e.preventDefault();const obj=normalize(applySegments({...x,id:old?.id||crypto.randomUUID(),name:$('#fName').value.trim(),part:$('#fPart').value,machine:$('#fMachine').value.trim(),gym:$('#fGym').value.trim(),date:$('#fDate').value,weightMode:$('#fMode').value,barWeight:$('#fBar').value.trim(),goal:$('#fGoal').value.trim(),coachNote:$('#fCoach').value.trim(),note:$('#fNote').value.trim(),trainingType:old?.trainingType||'solo',sessionId:old?.sessionId||'',courseReminder:old?.courseReminder||'',exerciseKey:undefined,history:[]},readSegments($('#recordSegments'))));obj.history=old?[...(old.history.length?old.history:[snapshot(old)]),snapshot(obj)]:[snapshot(obj)];const save=()=>{const next=old?data.map(v=>v.id===old.id?obj:v):[...data,obj];if(commit(next,'已儲存，留在原本的動作表'))modal.close()};if(old)save();else duplicateGuard(obj,save)};if(old)$('#deleteRecord').onclick=()=>{if(confirm('刪除這筆訓練紀錄？')){if(commit(data.filter(v=>v.id!==old.id),'已刪除這筆紀錄'))modal.close()}}}
function openDetails(key){const g=movementGroups().find(g=>g.key===key);if(!g)return;const rem=coachReminder(g);const rows=[];for(const x of g.items){const hs=x.history.length?x.history:[snapshot(x)];hs.forEach((h,i)=>rows.push({...x,...h,segments:h.segments||[],parent:x.id,isLatest:i===hs.length-1}))}rows.sort((a,b)=>(b.date||'').localeCompare(a.date||''));showModal(g.name,`${rem?`<div class="reminder"><div class="reminder-label">教練重點提醒</div>${esc(rem)}</div>`:'<div class="hint">上完教練課後，把姿勢與發力提醒補在這裡。</div>'}<div class="muted">同一動作的自主訓練與教練課成績</div>${rows.map(x=>`<div class="history-row"><div class="row"><span class="muted">${esc(dateText(x))} · ${x.trainingType==='coach'?'教練課':'自主訓練'}</span>${x.isLatest?`<button class="secondary small" data-edit="${esc(x.parent)}">修改</button>`:''}</div><p>${esc(amount(x))}</p><div class="weight-basis">${esc(basis(x))}</div>${x.gym?`<p class="muted">${esc(x.gym)}</p>`:''}${x.coachNote?`<p>教練提醒：${esc(x.coachNote)}</p>`:''}${x.note?`<p class="muted">${esc(x.note)}</p>`:''}</div>`).join('')}<button class="primary" id="detailRecord" style="width:100%;margin-top:16px">記錄本次訓練</button>`);modal.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openRecord(key,b.dataset.edit));$('#detailRecord').onclick=()=>openRecord(key)}
let courseDraft=[],draftId='',draftTitle='',draftDate='',draftReminder='';
function openCourse(id=null){const c=id?courses().find(c=>c.id===id):null;draftId=c?.id||'course-'+crypto.randomUUID();draftTitle=c?.title||'教練課';draftDate=c?.date??today();draftReminder=c?.reminder||'';courseDraft=c?c.items.map(x=>({...x,history:[...x.history],segments:segmentsOf(x)})):[];renderCourseForm()}
function readCourseForm(){draftTitle=$('#cTitle').value.trim()||'教練課';draftDate=$('#cDate').value;draftReminder=$('#cReminder').value.trim();modal.querySelectorAll('[data-row]').forEach(row=>{const x=courseDraft[Number(row.dataset.row)];for(const k of ['name','part','machine','gym','weightMode','barWeight','coachNote','note'])x[k]=row.querySelector(`[data-field="${k}"]`).value.trim();Object.assign(x,applySegments(x,readSegments(row)))})}
function renderCourseForm(){const groups=movementGroups().map(g=>{const items=g.items.filter(x=>x.gym==='信義');return {...g,sourceItems:g.items,items,latest:items[0]}}).filter(g=>g.latest);showModal('教練課筆記',`<form id="courseForm"><div class="form-grid">${field('課程名稱','cTitle',draftTitle)}${field('上課日期','cDate',draftDate,'date')}<div class="field full"><label for="cReminder">這堂課的重點提醒</label><textarea id="cReminder" placeholder="例如：先練動作穩定，再加重量；下次自主練習先複習划船。">${esc(draftReminder)}</textarea></div></div><div class="section-head"><h3>上課動作</h3><span class="muted">${courseDraft.length} 個</span></div>${courseDraft.map((x,i)=>`<div class="exercise-form" data-row="${i}"><div class="row"><span class="muted">動作 ${i+1}</span><button type="button" class="secondary small danger" data-remove="${i}">移除</button></div><div class="form-grid" style="margin-top:12px"><div class="field full"><label>動作名稱</label><input data-field="name" required value="${esc(x.name)}"></div><div class="field"><label>部位</label><select data-field="part">${parts.slice(1).map(p=>`<option ${p===x.part?'selected':''}>${p}</option>`).join('')}</select></div><div class="field"><label>器材／機台</label><input data-field="machine" value="${esc(x.machine)}"></div><div class="field"><label>重量怎麼算？</label><select data-field="weightMode">${Object.entries(modeLabels).filter(([k])=>k!=='unknown').map(([k,v])=>`<option value="${k}" ${k===x.weightMode?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>空槓重量 kg（選填）</label><input data-field="barWeight" value="${esc(x.barWeight)}"></div><div class="full">${segmentsOf(x).map(segmentFields).join('')}<button type="button" class="secondary small" data-course-segment="${i}" style="margin-top:12px">＋ 加一段重量</button></div><div class="field full"><label>這個動作的教練提醒</label><textarea data-field="coachNote" placeholder="姿勢、發力、下次自己練要注意什麼">${esc(x.coachNote)}</textarea></div><div class="field"><label>健身房</label><input data-field="gym" value="${esc(x.gym)}"></div><div class="field"><label>備註</label><input data-field="note" value="${esc(x.note)}"></div></div></div>`).join('')}<div class="field"><label for="pickMovement">從動作表加入</label><select id="pickMovement"><option value="">選擇現有動作…</option>${groups.map((g,i)=>`<option value="${i}">${esc(g.name)}${g.latest.machine?' · '+esc(g.latest.machine):''}</option>`).join('')}</select></div><div class="actions"><button type="button" class="secondary" id="addExisting">加入選取動作</button><button type="button" class="secondary" id="addCustom">＋ 新動作</button></div><button class="primary" style="width:100%;margin-top:22px">儲存整堂課</button></form>`);
$('#addExisting').onclick=()=>{const index=$('#pickMovement').value;if(index===''){toast('請先選擇動作');return}readCourseForm();const g=groups[Number(index)];courseDraft.push(normalize({...g.latest,id:crypto.randomUUID(),history:[],exerciseKey:g.key,gym:'信義',weight:'',reps:'',sets:'',segments:[],note:'',coachNote:coachReminder(g)}));renderCourseForm()};$('#addCustom').onclick=()=>{readCourseForm();courseDraft.push(normalize({id:crypto.randomUUID(),name:'',part:'背',gym:'信義'}));courseDraft.at(-1).name='';renderCourseForm()};modal.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{readCourseForm();courseDraft.splice(Number(b.dataset.remove),1);renderCourseForm()});modal.querySelectorAll('[data-course-segment]').forEach(b=>b.onclick=()=>{readCourseForm();const x=courseDraft[Number(b.dataset.courseSegment)];x.segments.push({weight:'',unit:x.unit||'kg',reps:'',sets:''});renderCourseForm()});modal.querySelectorAll('[data-remove-seg]').forEach(b=>b.onclick=()=>{const row=b.closest('[data-row]');readCourseForm();const x=courseDraft[Number(row.dataset.row)];if(x.segments.length===1){toast('至少保留一段紀錄');return}x.segments.splice(Number(b.dataset.removeSeg),1);renderCourseForm()});$('#courseForm').onsubmit=e=>{e.preventDefault();readCourseForm();if(!courseDraft.length){toast('請至少加入一個動作');return}const next=courseDraft.map(x=>{const old=data.find(v=>v.id===x.id);const obj=normalize({...x,date:draftDate,courseTitle:draftTitle,courseReminder:draftReminder,sessionId:draftId,trainingType:'coach',exerciseKey:undefined});const h=snapshot(obj);obj.history=old?[...(old.history.length?old.history:[snapshot(old)])]:[];if(!obj.history.length||JSON.stringify(obj.history.at(-1))!==JSON.stringify(h))obj.history.push(h);return obj});if(commit([...data.filter(x=>(x.sessionId||'legacy-'+x.id)!==draftId),...next],'整堂課已儲存，信義動作表同步更新'))modal.close()}}
function mergeBackup(current,incoming){const m=new Map(current.map(x=>[x.id,x]));for(const raw of incoming){if(!raw||typeof raw!=='object'||!raw.id||typeof raw.name!=='string')throw Error('invalid');const x=normalize(raw),old=m.get(x.id);if(!old)m.set(x.id,x);else{const h=[...old.history];for(const v of x.history)if(!h.some(y=>JSON.stringify(y)===JSON.stringify(v)))h.push(v);m.set(x.id,{...old,history:h})}}return [...m.values()]}
$('#movesView').onclick=()=>{view='moves';render()};$('#coursesView').onclick=()=>{view='courses';render()};$('#search').oninput=render;$('#addBtn').onclick=()=>view==='moves'?openRecord():openCourse();$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const incoming=JSON.parse(await f.text());if(!Array.isArray(incoming))throw Error();const next=mergeBackup(data,incoming);localStorage.setItem('workout-pre-import-backup',JSON.stringify(data));commit(next,'已合併匯入，保留原有紀錄')}catch{alert('匯入未成功，原有紀錄未變更。請選擇 JSON 備份檔。')}finally{e.target.value=''}};$('#exportBtn').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='workout-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></body></html>
