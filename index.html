<style>
:root{--bg:#101613;--panel:#1a231e;--line:#303d34;--muted:#a4b3a8;--ink:#edf3ee;--green:#c6ee9b;--blue:#b6d8ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:3px}.app{max-width:760px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 18px calc(36px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:16px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--green)}h1{font-size:28px;margin:6px 0}h2{font-size:22px;margin:0 0 18px}h3{font-size:17px;margin:0}p{line-height:1.6}.muted{color:var(--muted);font-size:13px;line-height:1.6}.nav{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;border:1px solid var(--line);border-radius:16px;margin:22px 0 18px;background:#131b16}.nav button{border:0;border-radius:11px;padding:12px;background:transparent;color:var(--muted)}.nav .active{background:var(--green);color:#172311;font-weight:700}.search,input,select,textarea{width:100%;color:var(--ink);background:#101813;border:1px solid var(--line);padding:12px;border-radius:11px;min-width:0}.search{background:var(--panel)}textarea{resize:vertical;min-height:80px}.filters{display:flex;overflow-x:auto;gap:8px;margin:14px 0 18px;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:30px;padding:8px 14px;color:var(--muted);background:transparent}.chip.active{border-color:var(--green);color:var(--green);background:#24321e}.section-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px;gap:10px}.primary{border:0;background:var(--green);color:#172311;border-radius:12px;padding:12px 16px;font-weight:700}.secondary{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:10px 12px}.small{font-size:12px;padding:8px 10px}.list{display:grid;gap:12px}.card{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{font-size:11px;color:var(--blue);background:#243742;border-radius:6px;padding:4px 7px;white-space:nowrap}.numbers{font-size:23px;font-weight:700;margin:13px 0 3px;letter-spacing:-.02em}.numbers span{font-size:14px;font-weight:400;color:var(--muted)}.reminder{border-left:2px solid var(--green);background:#223020;padding:10px 12px;border-radius:0 9px 9px 0;margin:14px 0;font-size:13px;line-height:1.65;white-space:pre-line}.reminder-label{color:var(--green);font-size:11px;margin-bottom:3px}.actions{display:flex;gap:8px;margin-top:15px}.actions>*{flex:1}.course-item{border-top:1px solid var(--line);padding:13px 0}.course-item:last-child{padding-bottom:0}.course-item .numbers{font-size:17px;margin:5px 0}.empty{text-align:center;padding:40px 12px;color:var(--muted);line-height:1.8}.footer{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:20px;margin-top:28px}.footer button{flex:1;color:var(--muted)}dialog{width:min(94vw,650px);max-height:88dvh;overflow:auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:22px}dialog::backdrop{background:#000b}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.full{grid-column:1/-1}.dialog-head{display:flex;align-items:start;justify-content:space-between}.close{background:transparent;color:var(--muted);border:0;padding:0 0 12px 12px;font-size:24px}.exercise-form{border:1px solid var(--line);border-radius:13px;padding:14px;margin:14px 0}.history-row{border-top:1px solid var(--line);padding:13px 0}.history-row p{margin:5px 0;font-size:13px;white-space:pre-line}.danger{color:#ffb3ae}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--green);color:#172311;padding:12px 18px;border-radius:12px;max-width:90vw;font-size:13px;z-index:99}.hint{border:1px dashed var(--line);border-radius:12px;padding:13px;line-height:1.7;font-size:13px;color:var(--muted);margin-bottom:16px}@media(max-width:430px){.app{padding-left:14px;padding-right:14px}.card{padding:15px}.form-grid{gap:10px}dialog{padding:18px}.numbers{font-size:21px}.row h3{font-size:16px}}[hidden]{display:none!important}
</style></head><body><main class="app"><header><div><div class="eyebrow">MY TRAINING NOTES</div><h1>我的訓練筆記</h1><div class="muted">上次的成績，下次的提醒。</div></div></header><nav class="nav" aria-label="檢視方式"><button id="movesView" class="active">動作表</button><button id="coursesView">教練課</button></nav><input class="search" id="search" type="search" placeholder="搜尋動作、場館或器材" aria-label="搜尋"><div class="filters" id="filters"></div><div class="section-head"><span class="muted" id="count"></span><button class="primary" id="addBtn">＋ 新增動作</button></div><div id="intro"></div><section class="list" id="list"></section><footer class="footer"><button class="secondary" id="exportBtn">匯出備份</button><button class="secondary" id="importBtn">匯入備份</button><input type="file" id="fileInput" accept="application/json,.json" hidden></footer></main><dialog id="modal"></dialog><div class="toast" id="toast" hidden></div><script>
const defaults=[

['胸','Wide Chest Press','','','2.5','10','做到 11 次',''],['胸','待確認動作','','C6','15','15','做到 16 次或小幅加重',''],['胸','待確認動作','','C7','5','—','補上次數',''],['胸','待確認動作','','N11','5','—','補上次數',''],['胸','待確認動作','','A11','15','—','補上次數',''],['胸','待確認動作','','C3','10','15','做到 16 次或小幅加重',''],['胸','待確認動作','','C4','5','20','小幅加重',''],['胸','下胸','','大型工作站','3.75','—','補上次數與單位',''],['胸','蝴蝶機夾胸','','','12.5','—','補上場館與次數',''],['胸','上胸擴胸','','','4.5 kg','—','補上次數',''],['胸','Cable 下胸下推','','','3.75 lb','—','補上場館與次數',''],
['肩','肩上舉','','','10','—','補上場館與次數',''],['肩','飛鳥','','','5','—','確認另一筆「飛鳥15」含義',''],['肩','待確認動作','','C1','12','—','補上動作名稱與次數',''],['肩','待確認動作','','T7','10','—','補上動作名稱與次數',''],['肩','待確認動作','','S2','5','—','補上動作名稱與次數',''],['肩','面拉','','','7.5','—','補上場館與次數',''],
['腿臀','Leg Curl','','L3','27','—','降重確認姿勢或換機台',''],['腿臀','倒蹬機','','','25','—','補上次數',''],['腿臀','待確認動作','','N1','11.3','12','做到 13 次',''],['腿臀','哈克深蹲','','','25＋45','15','同重量穩定完成',''],['腿臀','待確認動作','','L4','27＋2','—','補上次數與單位',''],['腿臀','待確認動作','','L7','19','—','補上動作名稱與次數',''],['腿臀','待確認動作','','L8','15','—','補上動作名稱與次數',''],['手','三頭肌','','A5','—','—','完成一組基準紀錄','']
].map((x,i)=>normalize({id:'seed-'+i,part:x[0],name:x[1],gym:x[2],machine:x[3],weight:x[4],reps:x[5],goal:x[6],note:x[7]}));
function normalize(x){return {...x,id:x.id||crypto.randomUUID(),part:x.part||'背',name:x.name||'未命名動作',gym:x.gym||'',machine:x.machine||'',weight:String(x.weight??'').replace(/\s*(kg|公斤|lb|磅)\s*/gi,' ').replace('—','').trim(),unit:x.unit||(/lb|磅/i.test(String(x.weight))?'lb':'kg'),reps:String(x.reps??'').replace('—',''),sets:String(x.sets||''),date:x.date||'',goal:x.goal||'',note:x.note||'',coachNote:x.coachNote||'',courseReminder:x.courseReminder||'',trainingType:x.trainingType==='coach'?'coach':'solo',sessionId:x.sessionId||'',history:Array.isArray(x.history)?x.history:[]}}
const $=s=>document.querySelector(s),modal=$('#modal'),parts=['全部','背','胸','肩','腿臀','手','伸展'];let view='moves',part='全部';
let data;try{data=(JSON.parse(localStorage.getItem('workout-data'))||defaults).map(normalize)}catch{data=defaults}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){return new Date().toLocaleDateString('sv-SE')}
function persist(){localStorage.setItem('workout-data',JSON.stringify(data))}
function toast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,2600)}
// An exercise groups across training types and locations; equipment variants stay distinct.
function exerciseKey(x){if(x.exerciseKey)return x.exerciseKey;let name=x.name.trim(),machine=x.machine.trim();if(machine==='啞鈴'&&['肩上推（前束）','啞鈴肩推'].includes(name))name='啞鈴肩推';if(/T[- ]?bar/i.test(name))return 'T-bar 划船|T-bar';return name+'|'+machine}
function sorted(items){return [...items].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||data.indexOf(b)-data.indexOf(a))}
function movementGroups(){const m=new Map();for(const x of data){const key=exerciseKey(x);if(!m.has(key))m.set(key,{key,items:[]});m.get(key).items.push(x)}return [...m.values()].map(g=>{g.items=sorted(g.items);g.latest=g.items[0];g.name=g.key==='啞鈴肩推|啞鈴'?'啞鈴肩推':g.latest.name;return g})}
function courses(){const m=new Map();for(const x of data.filter(x=>x.trainingType==='coach')){const id=x.sessionId||'legacy-'+x.id;if(!m.has(id))m.set(id,{id,date:x.date,title:x.courseTitle||'教練課',reminder:x.courseReminder||'',items:[]});m.get(id).items.push(x);if(x.courseReminder)m.get(id).reminder=x.courseReminder}return [...m.values()].sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function amount(x){const w=x.weight?(x.weight==='空槓'?'空槓':x.weight+' '+x.unit):'徒手／重量未填';return w+(x.reps?' · '+x.reps+' 次':'')+(x.sets?' × '+x.sets+' 組':'')}
function dateText(x){return x.date||'日期待補'}
function coachReminder(g){for(const x of g.items){if(x.coachNote)return x.coachNote;const h=[...x.history].reverse().find(h=>h.coachNote);if(h)return h.coachNote}return ''}
function render(){const q=$('#search').value.trim().toLowerCase();$('#movesView').classList.toggle('active',view==='moves');$('#coursesView').classList.toggle('active',view==='courses');$('#filters').hidden=view!=='moves';$('#filters').innerHTML=parts.map(p=>`<button class="chip ${part===p?'active':''}" data-part="${p}">${p}</button>`).join('');$('#filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{part=b.dataset.part;render()});$('#addBtn').textContent=view==='moves'?'＋ 新增動作':'＋ 記一堂課';$('#intro').innerHTML=view==='courses'?'<div class="hint">選動作表裡的動作來記錄上課內容。成績和教練提醒會一起回到動作表，自己練時也查得到。</div>':'';
if(view==='moves'){const groups=movementGroups().filter(g=>(part==='全部'||g.latest.part===part)&&[g.name,...g.items.flatMap(x=>[x.machine,x.gym,x.coachNote])].join(' ').toLowerCase().includes(q));$('#count').textContent=groups.length+' 個動作';$('#list').innerHTML=groups.map(g=>{const x=g.latest,rem=coachReminder(g),key=esc(g.key);return `<article class="card"><div class="row"><h3>${esc(g.name)}</h3><span class="muted">${esc(x.part)}</span></div><div class="muted">${esc([...new Set(g.items.map(x=>x.machine).filter(Boolean))].join(' · ')||'器材待補')}</div><div class="numbers">${esc(x.weight?(x.weight==='空槓'?'空槓':x.weight+' '+x.unit):'—')} <span>${esc(x.reps?x.reps+' 次'+(x.sets?' × '+x.sets+' 組':''):'次數未填')}</span></div><div class="row"><span class="muted">${esc(dateText(x))}${x.gym?' · '+esc(x.gym):''}</span>${x.trainingType==='coach'?'<span class="badge">教練課成績</span>':''}</div>${rem?`<div class="reminder"><div class="reminder-label">教練提醒 · 自己練前看一下</div>${esc(rem)}</div>`:''}${x.goal?`<div class="muted">下次目標：${esc(x.goal)}</div>`:''}<div class="actions"><button class="primary small" data-record="${key}">記錄本次</button><button class="secondary small" data-detail="${key}">歷史與提醒</button></div></article>`}).join('')||'<div class="empty">還沒有符合的動作<br>可以新增動作，或換個關鍵字搜尋。</div>';
$('#list').querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>openRecord(b.dataset.record));$('#list').querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetails(b.dataset.detail));
}else{const cs=courses().filter(c=>[c.date,c.title,c.reminder,...c.items.map(x=>x.name)].join(' ').toLowerCase().includes(q));$('#count').textContent=cs.length+' 堂教練課';$('#list').innerHTML=cs.map(c=>`<article class="card"><div class="row"><h3>${esc(c.title)}</h3><button class="secondary small" data-course="${esc(c.id)}">編輯課程</button></div><div class="muted">${esc(c.date||'日期待補')} · ${c.items.length} 個動作</div><div class="reminder"><div class="reminder-label">這堂課的重點提醒</div>${esc(c.reminder||'還沒記提醒，點「編輯課程」補上。')}</div>${c.items.map(x=>`<div class="course-item"><div class="row"><h3>${esc(x.name)}</h3><button class="secondary small" data-detail="${esc(exerciseKey(x))}">看動作</button></div><div class="numbers">${esc(amount(x))}</div>${x.coachNote?`<div class="muted">教練提醒：${esc(x.coachNote)}</div>`:''}${x.note?`<div class="muted">${esc(x.note)}</div>`:''}</div>`).join('')}</article>`).join('')||'<div class="empty">記下第一堂課吧<br>上課動作、重量和重點提醒會放在一起。</div>';$('#list').querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>openCourse(b.dataset.course));$('#list').querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetails(b.dataset.detail))}}
function showModal(title,content){modal.innerHTML=`<div class="dialog-head"><h2>${esc(title)}</h2><button type="button" class="close" aria-label="關閉">×</button></div>${content}`;modal.querySelector('.close').onclick=()=>modal.close();if(!modal.open)modal.showModal()}
function field(label,id,value='',type='text',full=false){return `<div class="field ${full?'full':''}"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`}
function partSelect(value,id='fPart'){return `<div class="field"><label for="${id}">部位</label><select id="${id}">${parts.slice(1).map(p=>`<option ${p===value?'selected':''}>${p}</option>`).join('')}</select></div>`}
function snapshot(x){return Object.fromEntries(['date','weight','unit','reps','sets','trainingType','sessionId','coachNote','note','gym','machine'].map(k=>[k,x[k]||'']))}
function openRecord(key=null,editId=null){const g=movementGroups().find(g=>g.key===key),old=editId?data.find(x=>x.id===editId):null,x=old||g?.latest||normalize({name:'',part:part==='全部'?'背':part});showModal(editId?'修改這筆紀錄':key?'記錄本次訓練':'新增動作',`<form id="recordForm"><div class="form-grid">${field('動作名稱','fName',x.name,'text',true)}${partSelect(x.part)}${field('器材／機台','fMachine',x.machine)}${field('健身房','fGym',x.gym)}${field('日期','fDate',editId?x.date:today(),'date')}${field('重量（也可以填空槓）','fWeight',x.weight)}<div class="field"><label for="fUnit">單位</label><select id="fUnit"><option value="kg" ${x.unit==='kg'?'selected':''}>公斤 kg</option><option value="lb" ${x.unit==='lb'?'selected':''}>磅 lb</option></select></div>${field('每組次數','fReps',x.reps,'text')}${field('組數','fSets',x.sets,'number')}${field('下次目標','fGoal',x.goal,'text',true)}<div class="field full"><label for="fCoach">教練提醒（自主練習也看得到）</label><textarea id="fCoach">${esc(old?.coachNote||coachReminder(g||{items:[]})||'')}</textarea></div>${field('當次感受／備註','fNote',editId?x.note:'','text',true)}</div><div class="actions">${old?'<button type="button" class="secondary danger" id="deleteRecord">刪除這筆</button>':''}<button class="primary">儲存紀錄</button></div></form>`);$('#fName').required=true;$('#fSets').min=1;$('#recordForm').onsubmit=e=>{e.preventDefault();const obj=normalize({...x,id:old?.id||crypto.randomUUID(),name:$('#fName').value.trim(),part:$('#fPart').value,machine:$('#fMachine').value.trim(),gym:$('#fGym').value.trim(),date:$('#fDate').value,weight:$('#fWeight').value.trim(),unit:$('#fUnit').value,reps:$('#fReps').value.trim(),sets:$('#fSets').value,goal:$('#fGoal').value.trim(),coachNote:$('#fCoach').value.trim(),note:$('#fNote').value.trim(),trainingType:old?.trainingType||'solo',sessionId:old?.sessionId||'',courseReminder:old?.courseReminder||'',exerciseKey:undefined,history:[]});obj.history=old?[...old.history,snapshot(obj)]:[snapshot(obj)];if(old)data=data.map(v=>v.id===old.id?obj:v);else data.push(obj);persist();modal.close();render();toast('已儲存，動作表已更新')};if(old)$('#deleteRecord').onclick=()=>{if(confirm('刪除這筆訓練紀錄？')){data=data.filter(v=>v.id!==old.id);persist();modal.close();render()}}}
function openDetails(key){const g=movementGroups().find(g=>g.key===key);if(!g)return;const rem=coachReminder(g);const rows=[];for(const x of g.items){const hs=x.history.length?x.history:[snapshot(x)];hs.forEach((h,i)=>rows.push({...x,...h,parent:x.id,isLatest:i===hs.length-1}))}rows.sort((a,b)=>(b.date||'').localeCompare(a.date||''));showModal(g.name,`${rem?`<div class="reminder"><div class="reminder-label">教練重點提醒</div>${esc(rem)}</div>`:'<div class="hint">上完教練課後，把姿勢與發力提醒補在這裡。</div>'}<div class="muted">同一動作的自主訓練與教練課成績</div>${rows.map(x=>`<div class="history-row"><div class="row"><span class="muted">${esc(dateText(x))} · ${x.trainingType==='coach'?'教練課':'自主訓練'}</span>${x.isLatest?`<button class="secondary small" data-edit="${esc(x.parent)}">修改</button>`:''}</div><p>${esc(amount(x))}</p>${x.gym?`<p class="muted">${esc(x.gym)}</p>`:''}${x.coachNote?`<p>教練提醒：${esc(x.coachNote)}</p>`:''}${x.note?`<p class="muted">${esc(x.note)}</p>`:''}</div>`).join('')}<button class="primary" id="detailRecord" style="width:100%;margin-top:16px">記錄本次訓練</button>`);modal.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openRecord(key,b.dataset.edit));$('#detailRecord').onclick=()=>openRecord(key)}
let courseDraft=[],draftId='',draftTitle='',draftDate='',draftReminder='';
function openCourse(id=null){const c=id?courses().find(c=>c.id===id):null;draftId=c?.id||'course-'+crypto.randomUUID();draftTitle=c?.title||'教練課';draftDate=c?.date??today();draftReminder=c?.reminder||'';courseDraft=c?c.items.map(x=>({...x,history:[...x.history]})):[];renderCourseForm()}
function readCourseForm(){draftTitle=$('#cTitle').value.trim()||'教練課';draftDate=$('#cDate').value;draftReminder=$('#cReminder').value.trim();modal.querySelectorAll('[data-row]').forEach(row=>{const x=courseDraft[Number(row.dataset.row)];for(const k of ['name','part','machine','gym','weight','unit','reps','sets','coachNote','note'])x[k]=row.querySelector(`[data-field="${k}"]`).value.trim()})}
function renderCourseForm(){const groups=movementGroups();showModal('教練課筆記',`<form id="courseForm"><div class="form-grid">${field('課程名稱','cTitle',draftTitle)}${field('上課日期','cDate',draftDate,'date')}<div class="field full"><label for="cReminder">這堂課的重點提醒</label><textarea id="cReminder" placeholder="例如：先練動作穩定，再加重量；下次自主練習先複習划船。">${esc(draftReminder)}</textarea></div></div><div class="section-head"><h3>上課動作</h3><span class="muted">${courseDraft.length} 個</span></div>${courseDraft.map((x,i)=>`<div class="exercise-form" data-row="${i}"><div class="row"><span class="muted">動作 ${i+1}</span><button type="button" class="secondary small danger" data-remove="${i}">移除</button></div><div class="form-grid" style="margin-top:12px"><div class="field full"><label>動作名稱</label><input data-field="name" required value="${esc(x.name)}"></div><div class="field"><label>部位</label><select data-field="part">${parts.slice(1).map(p=>`<option ${p===x.part?'selected':''}>${p}</option>`).join('')}</select></div><div class="field"><label>器材／機台</label><input data-field="machine" value="${esc(x.machine)}"></div><div class="field"><label>重量</label><input data-field="weight" value="${esc(x.weight)}" placeholder="數字或空槓"></div><div class="field"><label>單位</label><select data-field="unit"><option value="kg" ${x.unit==='kg'?'selected':''}>公斤 kg</option><option value="lb" ${x.unit==='lb'?'selected':''}>磅 lb</option></select></div><div class="field"><label>每組次數</label><input data-field="reps" value="${esc(x.reps)}" inputmode="numeric"></div><div class="field"><label>組數</label><input data-field="sets" type="number" min="1" value="${esc(x.sets)}"></div><div class="field full"><label>這個動作的教練提醒</label><textarea data-field="coachNote" placeholder="姿勢、發力、下次自己練要注意什麼">${esc(x.coachNote)}</textarea></div><div class="field"><label>健身房</label><input data-field="gym" value="${esc(x.gym)}"></div><div class="field"><label>備註</label><input data-field="note" value="${esc(x.note)}"></div></div></div>`).join('')}<div class="field"><label for="pickMovement">從動作表加入</label><select id="pickMovement"><option value="">選擇現有動作…</option>${groups.map((g,i)=>`<option value="${i}">${esc(g.name)}${g.latest.machine?' · '+esc(g.latest.machine):''}</option>`).join('')}</select></div><div class="actions"><button type="button" class="secondary" id="addExisting">加入選取動作</button><button type="button" class="secondary" id="addCustom">＋ 新動作</button></div><button class="primary" style="width:100%;margin-top:22px">儲存整堂課</button></form>`);
$('#addExisting').onclick=()=>{const index=$('#pickMovement').value;if(index===''){toast('請先選擇動作');return}readCourseForm();const g=groups[Number(index)];courseDraft.push(normalize({...g.latest,id:crypto.randomUUID(),history:[],exerciseKey:g.key,weight:'',reps:'',sets:'',note:'',coachNote:coachReminder(g)}));renderCourseForm()};$('#addCustom').onclick=()=>{readCourseForm();courseDraft.push(normalize({id:crypto.randomUUID(),name:'',part:'背'}));courseDraft.at(-1).name='';renderCourseForm()};modal.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{readCourseForm();courseDraft.splice(Number(b.dataset.remove),1);renderCourseForm()});$('#courseForm').onsubmit=e=>{e.preventDefault();readCourseForm();if(!courseDraft.length){toast('請至少加入一個動作');return}const next=courseDraft.map(x=>{const old=data.find(v=>v.id===x.id);const obj=normalize({...x,date:draftDate,courseTitle:draftTitle,courseReminder:draftReminder,sessionId:draftId,trainingType:'coach',exerciseKey:undefined});const h=snapshot(obj);obj.history=old?[...old.history]:[];if(!obj.history.length||JSON.stringify(obj.history.at(-1))!==JSON.stringify(h))obj.history.push(h);return obj});data=[...data.filter(x=>(x.sessionId||'legacy-'+x.id)!==draftId),...next];persist();modal.close();render();toast('整堂課已儲存，動作表同步更新')}}
function mergeBackup(current,incoming){const m=new Map(current.map(x=>[x.id,x]));for(const raw of incoming){if(!raw||typeof raw!=='object'||!raw.id||typeof raw.name!=='string')throw Error('invalid');const x=normalize(raw),old=m.get(x.id);if(!old)m.set(x.id,x);else{const h=[...old.history];for(const v of x.history)if(!h.some(y=>JSON.stringify(y)===JSON.stringify(v)))h.push(v);m.set(x.id,{...old,history:h})}}return [...m.values()]}
$('#movesView').onclick=()=>{view='moves';render()};$('#coursesView').onclick=()=>{view='courses';render()};$('#search').oninput=render;$('#addBtn').onclick=()=>view==='moves'?openRecord():openCourse();$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const incoming=JSON.parse(await f.text());if(!Array.isArray(incoming))throw Error();const next=mergeBackup(data,incoming);localStorage.setItem('workout-pre-import-backup',JSON.stringify(data));data=next;persist();render();toast('已合併匯入，保留原有紀錄')}catch{alert('匯入未成功，原有紀錄未變更。請選擇 JSON 備份檔。')}finally{e.target.value=''}};$('#exportBtn').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='workout-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></body></html>
